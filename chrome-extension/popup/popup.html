<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sheets Sorting Helper</title>
  <link rel="stylesheet" href="popup-styles.css">
</head>
<body>
  <div class="popup-container">
    <div class="header">
      <img src="../icons/icon-32.png" alt="Sheets Sorting Helper" class="logo">
      <h1>Sorting Helper</h1>
    </div>
    
    <div class="status-section">
      <div id="connection-status" class="status-item">
        <span class="status-dot" id="status-dot"></span>
        <span id="status-text">Checking connection...</span>
      </div>
    </div>
    
    <div class="quick-actions">
      <h2>Quick Actions</h2>
      <button id="quick-sort-btn" class="action-btn primary" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M3 18h6v-2H3v2zM3 6v2h18V6H3zm0 7h12v-2H3v2z"/>
        </svg>
        Quick Sort Selection
      </button>
      <button id="custom-sort-btn" class="action-btn secondary" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
          <path d="M11 17h2v-6h-2v6zm1-15C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 15h2v-2h-2v2zm0-4h2V8h-2v5z"/>
        </svg>
        Advanced Sort Options
      </button>
    </div>
    
    <div class="features-section">
      <h2>Features</h2>
      <div class="feature-list">
        <div class="feature-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>
          </svg>
          Multi-column sorting
        </div>
        <div class="feature-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>
          </svg>
          Custom sort orders
        </div>
        <div class="feature-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>
          </svg>
          Preview before applying
        </div>
        <div class="feature-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4L9 16.2z"/>
          </svg>
          Auto-sort setup
        </div>
      </div>
    </div>
    
    <div class="settings-section">
      <h2>Settings</h2>
      <div class="setting-item">
        <label>
          <input type="checkbox" id="show-preview" checked>
          Show preview before sorting
        </label>
      </div>
      <div class="setting-item">
        <label>
          <input type="checkbox" id="auto-detect-headers" checked>
          Auto-detect header rows
        </label>
      </div>
      <div class="setting-item">
        <label for="default-sort-order">Default sort order:</label>
        <select id="default-sort-order">
          <option value="asc">Ascending (A-Z)</option>
          <option value="desc">Descending (Z-A)</option>
        </select>
      </div>
    </div>
    
    <div class="footer">
      <div class="links">
        <a href="#" id="help-link">Help</a>
        <a href="#" id="feedback-link">Feedback</a>
      </div>
      <div class="version">v1.0.0</div>
    </div>
  </div>
  
  <script src="popup-script.js"></script>
</body>
</html>
